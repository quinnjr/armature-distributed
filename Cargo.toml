[package]
name = "armature-distributed"
version = "0.3.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-distributed"
homepage = "https://quinnjr.github.io/armature"
description = "Distributed systems primitives for Armature"
keywords = ["distributed", "locks", "consensus", "cluster"]
categories = ["web-programming", "concurrency"]

[dependencies]
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
# Redis for distributed locks/leader election - uses armature-redis for DI integration
armature-redis = { version = "0" }
redis = { version = "1.3", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23", features = ["v4"] }
chrono = "0.4"
thiserror = "2.0"
tracing = "0.1"
rand = "0.10"

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio-test = "0.4"
armature-testkit = { path = "../armature-testkit", features = ["containers"] }

